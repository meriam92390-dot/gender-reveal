<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gender Reveal</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #fdf6f0;
      font-family: 'Arial', sans-serif;
    }
    .card-container {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .reveal-content {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      text-align: center;
    }
    .reveal-content h1 {
      font-size: 26px;
      color: #333;
      margin: 0;
    }
    .reveal-content .baby-tag {
      font-size: 32px;
      font-weight: bold;
      color: #ff6b81; /* Changez la couleur ici (ex: #70a1ff pour un garçon) */
      margin-top: 10px;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: pointer;
      touch-action: none;
    }
  </style>
</head>
<body>

  <h2 style="color: #666; margin-bottom: 20px;">Grattez pour découvrir ! 👶</h2>

  <div class="card-container">
    <!-- Message caché sous la zone à gratter -->
    <div class="reveal-content">
      <h1>C'est une...</h1>
      <div class="baby-tag">FILLE ! 🎀</div>
      <!-- Remplacez par "GARÇON ! 🚙" si besoin -->
    </div>

    <!-- Couche à gratter -->
    <canvas id="scratchCanvas" width="300" height="300"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');

    // Couleur de surface à gratter (dorée/argentée)
    ctx.fillStyle = '#d4af37';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Texte sur la couche à gratter
    ctx.font = 'bold 20px Arial';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText('✨ Grattez ici ✨', canvas.width / 2, canvas.height / 2);

    let isDrawing = false;

    function scratch(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x, y, 22, 0, Math.PI * 2);
      ctx.fill();
    }

    canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
    canvas.addEventListener('mousemove', scratch);
    window.addEventListener('mouseup', () => isDrawing = false);

    canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, { passive: false });
    canvas.addEventListener('touchmove', scratch, { passive: false });
    window.addEventListener('touchend', () => isDrawing = false);
  </script>
</body>
</html>
